name: deploy-swagger-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure API server
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          server_url="${API_BASE_URL:-http://127.0.0.1:8000}"
          jq --arg url "$server_url" '.servers = [{"url": $url}]' site/openapi.json > site/openapi.tmp
          mv site/openapi.tmp site/openapi.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
